version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: weblarek-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: weblarek
    ports:
      - "27018:27017"  # Порт для подключения с хоста (Compass, бэкенд)
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - weblarek-dev-network

  frontend:
    image: node:18-alpine
    container_name: weblarek-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "8080:8080"  # Vite dev server
    environment:
      - NODE_ENV=development
      - API_BASE_URL=http://localhost:3000/api  # Бэкенд на хосте
    networks:
      - weblarek-dev-network

  nginx:
    image: nginx:alpine
    container_name: weblarek-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - weblarek-dev-network

volumes:
  mongodb_data:

networks:
  weblarek-dev-network:
    driver: bridge