- name: Запуск Docker-контейнеров
  run: |
    docker-compose up -d
    echo "Ожидание запуска контейнеров..."
    sleep 15
    docker-compose ps
    # Проверка nginx
    curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost || exit 1
    # Проверка бэкенда напрямую
    curl --retry 5 --retry-delay 3 http://localhost:3000/api/health || true