server {
    listen 80;
    server_name localhost;

    # Корень для фронтенда
    root /usr/share/nginx/html;
    index index.html;

    # Прокси для фронтенда (Vite dev server)
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Прокси для API к бэкенду на хосте
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Для поддержки больших запросов (заказы)
        client_max_body_size 10M;
    }

    # Прокси для админки к бэкенду на хосте
    location /admin/ {
        proxy_pass http://host.docker.internal:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси для статики (изображения) к бэкенду на хосте
    location /images/ {
        proxy_pass http://host.docker.internal:3000/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        expires 1h;
    }
}